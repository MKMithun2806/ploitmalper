[package]
name = "ploit_malper"
version = "0.1.0"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
sha2 = "0.10"
thiserror = "2.0"
lazy_static = "1.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
