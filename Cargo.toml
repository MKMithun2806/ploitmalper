[package]
name = "ploit-malper"
version = "0.2.3"
edition = "2021"

description = "Post-exploitation analysis and vulnerability intelligence toolkit"
license = "MIT"
repository = "https://github.com/MKMithun2806/ploitmalper"
readme = "README.md"

keywords = [
    "security",
    "vulnerability",
    "analysis",
    "pentest",
    "cli"
]

categories = [
    "command-line-utilities"
]

[[bin]]
name = "ploit-malper"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls"
] }
regex = "1.11"
sha2 = "0.10"
thiserror = "2.0"
rusqlite = { version = "0.37", features = ["bundled"] }
time = { version = "0.3", features = ["std", "formatting", "parsing"] }
ratatui = "0.30.2"
crossterm = "0.29.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
