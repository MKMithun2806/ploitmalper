[package]
name = "ploit_malper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ploit-malper"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
sha2 = "0.10"
thiserror = "2.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
